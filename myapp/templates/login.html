{% extends "auth_base.html" %}

{% block title %}Login | Scope India{% endblock %}
{% block heading %}Login{% endblock %}

{% block content %}
  <form method="POST" class="reg-form auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
  <p class="auth-links">New here? <a href="{% url 'register' %}">Create an account</a></p>
{% endblock %}
