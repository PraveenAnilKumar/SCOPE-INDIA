<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/homestyle.css' %}?v=3" />
    <link rel="icon" type="image/png" href="{% static 'images/bird.png' %}" />
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <a href="{% url 'home' %}">
          <img
            class="logo-img"
            src="{% static 'images/scopeindia-logo.png' %}"
            alt="Scope India Logo"
          />
        </a>

        <div class="right-section">
          <img
            class="rating-img"
            src="{% static 'images/google-rating-scope-india.png' %}"
            alt="Google Rating Scope India"
          />

          <div class="nav-links">
            <a href="{% url 'home' %}" class="active-text">HOME</a>
            <a href="{% url 'courses' %}">COURSES</a>
            <a href="{% url 'registration' %}" class="active-pill"
              >REGISTRATION</a
            >
            <a href="{% url 'placements' %}">PLACEMENTS</a>
            <a href="{% url 'about' %}">ABOUT US</a>
            <a href="{% url 'faq' %}">FAQ</a>
            <a href="{% url 'reviews' %}">REVIEWS</a>
            <a href="{% url 'contacts' %}">CONTACT US</a>
            <a href="{% url 'logout' %}" class="logout-btn">LOGOUT</a>
          </div>
        </div>
      </div>
    </div>
    -
  </body>
</html>
